[package]
name = "thermal-eye"
version = "0.2.1"
edition = "2024"
description = "A compact Windows desktop widget for system temperatures and usage"
license = "MIT"
authors = ["Dominique Bastenie"]
repository = "https://github.com/H3katonkheir/thermal-eye"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[dev-dependencies]
getrandom = "0.4"

[build-dependencies]
winresource = "0.1"
